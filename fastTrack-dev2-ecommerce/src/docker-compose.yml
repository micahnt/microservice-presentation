name: ecommerce

services:
  catalogdb:
    image: postgres:18

  distributedcache:
    image: redis:8

  orderdb:
    image: mcr.microsoft.com/mssql/server:2025-latest

  messagebroker:
    image: rabbitmq:4.3-management   # 3.13 left community support in Sep 2024; MassTransit 8.1 uses no deprecated features (checked)

  ecommerce.identity.api:
    image: ${DOCKER_REGISTRY-}ecommerceidentityapi
    build:
      context: .
      dockerfile: Services/Identity/Ecommerce.Identity.Api/Dockerfile

  ecommerce.catalog.api:
    image: ${DOCKER_REGISTRY-}ecommercecatalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Ecommerce.Catalog.Api/Dockerfile

  ecommerce.basket.api:
    image: ${DOCKER_REGISTRY-}ecommercebasketapi
    build:
      context: .
      dockerfile: Services/Basket/Ecommerce.Basket.Api/Dockerfile

  ecommerce.discount.grpc:
    image: ${DOCKER_REGISTRY-}ecommercediscountgrpc
    build:
      context: .
      dockerfile: Services/Discount/Ecommerce.Discount.Grpc/Dockerfile

  ecommerce.ordering.api:
    image: ${DOCKER_REGISTRY-}ecommerceorderingapi
    build:
      context: .
      dockerfile: Services/Ordering/Ecommerce.Ordering.Api/Dockerfile

  ecommerce.yarpapigateway:
    image: ${DOCKER_REGISTRY-}ecommerceyarpapigateway
    build:
      context: .
      dockerfile: ApiGateways/Ecommerce.YarpApiGateway/Dockerfile

volumes:
  postgres_catalog:
  redis_data:
  mssql_data:
  rabbitmq_data:
